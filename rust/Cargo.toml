[package]
name = "fast-dp-boot-kernels"
version = "0.1.0"
edition = "2021"
description = "Exact Efron bootstrap mean sampling kernels for fast-dp-boot"
publish = false

[lib]
name = "dp_boot_native"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
pyo3 = { version = "0.29", optional = true }
numpy = { version = "0.29", optional = true }
